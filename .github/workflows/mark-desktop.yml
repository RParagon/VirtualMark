name: Mark Desktop (Windows)

on:
  push:
    paths:
      - "mark-desktop/**"
      - ".github/workflows/mark-desktop.yml"
  workflow_dispatch:

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mark-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mark-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mark-desktop/src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Mark-instalador-windows
          path: mark-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
