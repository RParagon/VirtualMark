<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstico Imobiliário | Virtual Mark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="brand-panel" aria-label="Resumo do diagnóstico">
        <div class="brand-mark">
          <span class="brand-icon">VM</span>
          <span>
            <strong>Virtual Mark</strong>
            <small>Marketing imobiliário</small>
          </span>
        </div>

        <div class="signal-map" aria-hidden="true">
          <div class="signal-row active">
            <span></span>
            <p>Reconhecer o momento</p>
          </div>
          <div class="signal-row">
            <span></span>
            <p>Encontrar o gargalo</p>
          </div>
          <div class="signal-row">
            <span></span>
            <p>Mapear a estrutura</p>
          </div>
          <div class="signal-row">
            <span></span>
            <p>Definir o plano</p>
          </div>
        </div>

        <div class="panel-note">
          <span>Diagnóstico estratégico</span>
          <strong>Capte compradores certos, com canal próprio e números claros.</strong>
        </div>
      </aside>

      <section class="quiz-card" aria-live="polite">
        <header class="topbar">
          <button class="icon-button" id="backBtn" type="button" aria-label="Voltar">
            <span aria-hidden="true">←</span>
          </button>
          <div class="progress-wrap" aria-label="Progresso">
            <div class="progress-meta">
              <span id="stepLabel">Início</span>
              <span id="progressLabel">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>
        </header>

        <div class="screen" id="screen"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
