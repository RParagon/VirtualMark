[package]
name = "mark-desktop"
version = "0.1.0"
description = "Mark, o mascote da Virtual Mark, na área de trabalho"
authors = ["Virtual Mark"]
edition = "2021"

[lib]
name = "mark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binário pequeno: o objetivo é gastar pouca memória e disco.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
